name: Command88 eight-executive dialogue regression

on:
  push:
    branches:
      - command88-natural-conversations-2026-10-09
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dialogue-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/cyrus-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check all runtime and test modules
        run: |
          set -eu
          find src test -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run complete offline test suite
        run: node --test test/*.test.js
