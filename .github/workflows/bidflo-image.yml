name: Visez Release Image

on:
  push:
    branches:
      - 'codex/bidflo-release-*'
    paths:
      - 'bidflo/**'
      - '.github/workflows/bidflo-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: visez-release-image
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/atlasium788ai/visez

jobs:
  build-and-publish:
    name: Build and publish linux/amd64 image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bidflo/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Visez

      - name: Verify anonymous image pull
        run: |
          docker logout ghcr.io
          docker pull "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Record immutable image reference
        run: echo "${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
