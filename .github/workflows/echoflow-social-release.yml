name: EchoFlow Social release checks

on:
  pull_request:
    paths:
      - ".github/workflows/echoflow-social-release.yml"
      - ".openai/hosting.json"
      - "app/**"
      - "build/**"
      - "db/**"
      - "drizzle/**"
      - "worker/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
  push:
    branches:
      - main
      - fix/echoflow-direct-publishing-only-20261018
    paths:
      - ".github/workflows/echoflow-social-release.yml"
      - ".openai/hosting.json"
      - "app/**"
      - "build/**"
      - "db/**"
      - "drizzle/**"
      - "worker/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test ECHO, FLOW, AMPLIFY
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies without modifying lockfile
        run: pnpm install --frozen-lockfile
      - name: Compile site and run offline social workflow tests
        run: pnpm test
