name: Atlasium six-role real model exam
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  specialist-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fail safely when model API is not configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then echo "::error::OPENAI_API_KEY unavailable. No live test or paid usage performed."; exit 2; fi
      - name: Evaluate six role prompts against a real model without any live business tools
        working-directory: services/cyrus-runtime
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_MODEL: gpt-4o-mini
        run: node test/live-model-eval.mjs
